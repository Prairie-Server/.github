# Copy to .github/workflows/upstream-sync.yml in a prairie-* fork and set `upstream`.
name: Upstream sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    if: github.event_name != 'pull_request'
    uses: Prairie-Server/.github/.github/workflows/upstream-sync.yml@main
    with:
      upstream: Silo-Server/silo-server
    secrets:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

  audit:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'sync/')
    uses: Prairie-Server/.github/.github/workflows/upstream-sync-audit.yml@main
    with:
      upstream: Silo-Server/silo-server
