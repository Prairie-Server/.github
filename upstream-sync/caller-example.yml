# Optional. upstream-sync-all.yml in Prairie-Server/.github already syncs every Prairie-Server
# fork centrally. Add this file to a fork as .github/workflows/upstream-sync.yml only if you
# want (a) the audit as a status check on every push to a sync PR, or (b) the fork to sync on
# its own schedule. Set `upstream` to the fork's Silo parent.
name: Upstream sync

on:
  pull_request:
    branches: [main]
  # schedule:
  #   - cron: "17 9 * * *"
  # workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'sync/')
    uses: Prairie-Server/.github/.github/workflows/upstream-sync-audit.yml@main
    with:
      upstream: Silo-Server/silo-server

